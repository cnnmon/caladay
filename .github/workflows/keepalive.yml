name: Supabase keep-alive
# Free-tier Supabase projects pause after ~7 days without traffic.
# One trivial read a day keeps the leaderboard alive regardless of usage.
# No event-derived input is used anywhere in this workflow.
on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping leaderboard
        run: |
          curl -sf "https://magjhbcmgjywhmqezgsl.supabase.co/rest/v1/solutions?select=id&limit=1" \
            -H "apikey: sb_publishable_cFHcVtjNbV093WNWBEV6xg__McxPxjs" \
            -o /dev/null
